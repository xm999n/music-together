name: Android CI

on:
  push:
    branches:
      - codex/android-native-client
    paths:
      - "packages/android-client/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build debug-signed release APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/android-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleStandardRelease assembleVivoRelease

      - name: Verify debug signatures
        run: |
          set -euo pipefail
          for apk in \
            app/build/outputs/apk/standard/release/app-standard-release.apk \
            app/build/outputs/apk/vivo/release/app-vivo-release.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk dist/music-together-standard-release-debug-signed.apk
          cp app/build/outputs/apk/vivo/release/app-vivo-release.apk dist/music-together-vivo-release-debug-signed.apk
          cd dist
          sha256sum *.apk > SHA256SUMS

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: music-together-release-debug-signed-${{ github.run_number }}
          path: packages/android-client/dist/*
          if-no-files-found: error
          retention-days: 30
